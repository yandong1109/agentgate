[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentgate"
version = "0.1.0"
description = "Open-source evaluation harness for enterprise agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Open Fin" }
]
dependencies = [
  "pydantic>=2.0",
  "typer>=0.12",
  "rich>=13.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "opentelemetry-proto>=1.27",
  "jsonschema>=4.20",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.scripts]
agentgate = "agentgate.cli.application:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]  # typer.Option in defaults is the standard Typer pattern

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports are intentional in package init
